[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hf2ollama"
version = "0.1.0"
description = "Convert an HF model id (or local dir) to a quantized GGUF loadable by Ollama via a generated Modelfile."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "huggingface",
    "ollama",
    "gguf",
    "quantization",
    "llama.cpp",
    "model-conversion",
    "llm",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "huggingface_hub>=0.20",
    "requests>=2.28",
    "rich>=13.0",
    "tqdm>=4.64",
]

[project.scripts]
hf2ollama = "hf2ollama.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.10"]

[project.urls]
Homepage = "https://github.com/R0U5/hf2ollama"
Repository = "https://github.com/R0U5/hf2ollama"
Issues = "https://github.com/R0U5/hf2ollama/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/*" = []